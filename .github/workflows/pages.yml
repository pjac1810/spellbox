# Builds the firmware and publishes the site (emulator, installer, rescue) to GitHub Pages.
# Settings -> Pages -> Source: GitHub Actions. Tags (v0.2) also get a release with the .fwsc.
name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./fm1 build
      - uses: actions/upload-artifact@v4
        with:
          name: spellbox-fwsc
          path: build/*.fwsc
      - name: Put the .fwsc on the firmware branch (a direct download)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir /tmp/fw && cp build/*.fwsc /tmp/fw/
          cd /tmp/fw
          git init -q -b firmware
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -q --allow-empty -m "firmware from ${GITHUB_SHA::7}"
          git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -q -m "spellbox .fwsc from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" firmware
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: build/web
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: build/*.fwsc
  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Publishing needs Settings -> Pages -> Source: GitHub Actions. Until it is on, this job is
    # allowed to fail without turning the run red: the firmware (.fwsc) comes from the build job.
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
